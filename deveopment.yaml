apiVersion: v1
kind: Namespace
metadata:
  name: spandhana-ns

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-app
  namespace: spandhana-ns

spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator

  template:
    metadata:
      labels:
        app: calculator

    spec:
      containers:
        - name: calculator-container
          # The Jenkinsfile script automatically replaces IMAGE_PLACEHOLDER with the built image path
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: calculator-service
  namespace: spandhana-ns
spec:
  selector:
    app: calculator
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
