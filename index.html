<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74abe2 0%, #5563de 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 320px;
        }
        .display {
            width: 100%;
            height: 50px;
            background-color: #f4f6f9;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: right;
            padding: 0 10px;
            box-sizing: border-box;
            color: #333;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #e9ecef;
            transition: background 0.2s;
        }
        button:hover { background-color: #dee2e6; }
        button.operator { background-color: #ff9f0a; color: white; }
        button.operator:hover { background-color: #cc7f08; }
        button.clear { background-color: #ff3b30; color: white; }
        button.clear:hover { background-color: #d32f2f; }
        button.equal { background-color: #34c759; color: white; grid-column: span 2; }
        button.equal:hover { background-color: #28a745; }
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #777;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" class="display" id="screen" readonly>
    <div class="buttons">
        <button class="clear" onclick="clearScreen()">C</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        <button onclick="appendValue('-')" class="operator">-</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('+')" class="operator">+</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('.')">.</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('0')">0</button>
        
        <button class="equal" onclick="calculate()">=</button>
    </div>
    <div class="footer">Deployed via Jenkins to AKS 🚀</div>
</div>

<script>
    const screen = document.getElementById('screen');
    function appendValue(val) { screen.value += val; }
    function clearScreen() { screen.value = ''; }
    function calculate() {
        try {
            if(screen.value) { screen.value = eval(screen.value); }
        } catch(err) {
            screen.value = 'Error';
        }
    }
</script>
</body>
</html>
